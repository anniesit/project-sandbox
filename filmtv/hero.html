<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero — local preview</title>

<!--
  Local preview harness for the Home page hero carousel.

  This mirrors the DOM contract the Webflow build uses, so the JS can be
  exercised without the Designer. The styling below is a STAND-IN for the
  Webflow classes — it is deliberately rough and is NOT the source of
  truth for anything visual. Only hero.css ships; everything in the
  <style> block here stays local.

  Serve it with:  python3 serve.py 8753   ->  /hero.html
-->

<link rel="stylesheet" href="hero.css">

<style>
  :root {
    --sky-700: #003240;
    --sky-400: #007c9e;
    --grass-200: #b9e48b;
    --watermelon-400: #b62602;
    --neutral-025: #fdfefb;
    --peach: #ffd1b1;
  }

  /* Stand-in for the Webflow page-wrapper: the dot pattern variables the
     shipped hero.css reads, plus the paper stock the hero sits on. */
  body {
    margin: 0;
    --dot-image:
      radial-gradient(circle, #edeae8 1.3px, transparent 1.3px),
      radial-gradient(circle, #edeae8 1.3px, transparent 1.3px);
    --dot-size: 6px 6px;
    --dot-offset: 0 0, 3px 3px;
    background-color: #fdfefb;
    background-image: var(--dot-image);
    background-size: var(--dot-size);
    background-position: var(--dot-offset);
    background-blend-mode: overlay, overlay;
    font-family: system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--sky-700);
  }

  /* --- the two colour-paper shapes behind the whole page ---
     In Webflow this div is the first child of .page-wrapper, not of the
     hero section, so the paper runs under the navbar and on into the
     next section. z-index -1 puts it above the wrapper's own background
     but below every in-flow element, which needs no z-index on the nav
     or the main column. */
  body { position: relative; }
  .hero { position: relative; }
  .hero-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }
  .hero-paper { position: absolute; transform-origin: 50% 50%; }
  /* Stand-in for the rule in the Webflow Page CSS embed: same dot motif
     and pitch as the page wrapper, but translucent, because `overlay`
     blows a near-white dot out on saturated colour. */
  .hero-paper {
    --dot-image:
      radial-gradient(circle, rgba(255,255,255,.18) 1.3px, transparent 1.3px),
      radial-gradient(circle, rgba(255,255,255,.18) 1.3px, transparent 1.3px);
    background-image: var(--dot-image);
    background-size: var(--dot-size);
    background-position: var(--dot-offset);
    background-blend-mode: overlay, overlay;
  }
  .hero-paper.cc-green {
    width: 90.25rem; height: 90.25rem; left: 30.7%; top: 13.125rem;
    background-color: #8eb27d; transform: rotate(25.41deg);
  }
  .hero-paper.cc-orange {
    width: 103.5rem; height: 103.5rem; left: 26.5%; top: 17.25rem;
    background-color: #ff9352; transform: rotate(45deg);
  }
  .hero-layout { position: relative; z-index: 1; }

  .demo-bar {
    background: var(--sky-700);
    color: #fff;
    padding: 8px 16px;
    font-size: 13px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .demo-bar button {
    font: inherit;
    padding: 4px 10px;
    border: 0;
    border-radius: 3px;
    cursor: pointer;
  }

  .hero-layout {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
    padding: 0 24px;
    /* The collage runs off the right edge in the design, so it is clipped
       here the way the Figma frame clips it. */
    overflow: hidden;
  }

  .hero-content { flex: 0 1 456px;  min-width: 0; }
  .hero-stats   { flex: 0 1 456px;  min-width: 0; position: relative; align-self: flex-end; }
  .hero-visual  { flex: 1 1 0;      min-width: 0; }

  .hero-eyebrow { font-size: 28px; font-weight: 700; margin: 0 0 4px; }
  .hero-title   { font-size: 44px; line-height: 1.1; margin: 0 0 16px; }
  .hero-intro   { font-size: 15px; line-height: 1.7; margin: 0 0 24px; }

  /* --- collection list --- */
  .hero-collection-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .hero-collection-item { flex: none; }

  .hero-collection-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    height: 4.25rem;
    padding: 0 0.75rem;
    border-radius: 0.25rem;
    background: var(--grass-200);
    box-shadow: 0.5rem 0.5rem 0 0 var(--sky-700);
    color: inherit;
    text-decoration: none;
    transition: background-color 250ms ease;
  }
  .hero-collection-link.is-active { background: var(--peach); }

  .hero-collection-dot {
    width: 2rem;
    height: 2rem;
    flex: none;
    border-radius: 50%;
    background: var(--sky-400);
    transition: background-color 250ms ease;
  }
  /* The active dot colour is NOT set here on purpose — hero.css owns that
     rule, and duplicating it would hide a regression in the shipped file.
     This stands in for the Webflow theme variable it reads
     (Primary/Hero Dot Active), which the real site defines on :root. */
  :root { --primary--hero-dot-active: #ff8a39; }

  .hero-collection-label { font-size: 50px; font-weight: 700; line-height: 1.1; }

  .hero-collection-nav {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding-top: 12px;
  }
  .hero-nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--sky-700);
    cursor: pointer;
    font-size: 48px;
    line-height: 1;
  }

  /* --- stats --- */
  .hero-stats-label { font-size: 28px; font-weight: 700; margin: 0 0 12px; }
  .stats-wrap { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .stat {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 2px 12px;
    background: var(--neutral-025);
    border: 2px solid var(--sky-700);
  }
  .stat.cc-1 { transform: rotate(-11.16deg); }
  .stat.cc-2 { transform: rotate(5.07deg); align-self: center; }
  .stat.cc-3 { transform: rotate(-1.51deg); align-self: flex-end; }
  .stat-num  { font-size: 38px; color: var(--watermelon-400); font-weight: 700; }
  .stat-unit { font-size: 22px; }

  .hero-arrow-btn {
    position: absolute;
    left: 70%;
    top: 48px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    border: 2px solid var(--sky-700);
    border-radius: 50%;
    background: var(--neutral-025);
    box-shadow: 8px 8px 0 0 var(--sky-700);
    color: inherit;
    text-decoration: none;
    font-size: 38px;
  }

  .hero-year { position: relative; width: 100%; }
  .hero-year-label { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  .hero-year-grid {
    display: grid;
    grid-template-columns: repeat(10, 1.5rem);
    gap: 0.25rem;
    padding: 1.5rem 2rem;
    background: var(--neutral-025);
    border: 2px solid var(--sky-700);
    width: max-content;
  }
  .hero-year-cell { width: 1.5rem; height: 1.5rem; background: var(--sky-400); }
  .hero-year-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 2px 12px;
    background: var(--grass-200);
    border: 2px solid var(--sky-700);
  }
  .hero-year-num  { font-size: 38px; color: var(--watermelon-400); font-weight: 700; }
  .hero-year-unit { font-size: 22px; }
  .hero-year-chip.cc-start { position: absolute; right: 0; top: 0;    z-index: 2; }
  .hero-year-chip.cc-end   { position: absolute; right: 0; bottom: 0; z-index: 2; }
  /* Stand-ins for the site's own .popover and .paragraph-sm classes,
     which live in Webflow. Only here so the tooltip is visible locally. */
  .popover {
    position: fixed;
    width: 100%;
    max-width: 20rem;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--sky-400);
    border-radius: 0.25rem;
    background: #d1ecb4;
    color: var(--sky-700);
  }
  .popover.cc-year-tip {
    top: 0; left: 0; right: auto; bottom: auto;
    width: max-content;
    max-width: 16rem;
    margin-bottom: 0;
    pointer-events: none;
  }
  .paragraph-sm { font-size: 0.95rem; line-height: 1.8; }
  .paragraph-sm.cc-tip { margin: 0; white-space: nowrap; }
  .hero-year-cell.is-empty { background: transparent; border: 2px solid #afd7e0; }

  .hero-year-line {
    position: absolute;
    right: 112px;
    top: 104px;
    width: 2px;
    height: 212px;
    background: var(--neutral-025);
    transform: rotate(13.74deg);
    z-index: 1;
  }

  /* --- gallery --- */
  .hero-gallery {
    position: relative;
    /* Wider than its column on purpose — this is the right-edge bleed. */
    width: 110%;
    aspect-ratio: 1004 / 1017;
  }
  .hero-slide { position: absolute; inset: 0; }
  .hero-layer { position: absolute; }
  .hero-layer-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #d9d9d9;
    border: 1px dashed rgba(0, 50, 64, .5);
  }

  /* placeholder geometry, traced from the Figma hero image box */
  /* z-index restores the Figma stacking. It is deliberately NOT the source
     order: source order carries the ANIMATION order (data-layer 1 animates
     first), and the two are different sequences. */
  .hero-layer.cc-layer-1 { left: 0;     top: 64.6%; width: 36.7%; aspect-ratio: 368/442; z-index: 5; }
  .hero-layer.cc-layer-2 { left: 33.8%; top: 40.3%; width: 37.5%; aspect-ratio: 376/552; z-index: 4; }
  .hero-layer.cc-layer-3 { left: 8.0%;  top: 19.8%; width: 35.3%; aspect-ratio: 355/494; z-index: 2; }
  .hero-layer.cc-layer-4 { left: 2.6%;  top: 9.3%;  width: 31.9%; aspect-ratio: 320/102; z-index: 3; }
  .hero-layer.cc-layer-5 { right: 2.6%; top: 6.7%;  width: 34.7%; aspect-ratio: 349/505; z-index: 1; }

  .hero-layer-img.cc-tilt-1 { transform: rotate(-19.05deg); }
  .hero-layer-img.cc-tilt-2 { transform: rotate(-3.97deg); box-shadow: 12px 12px 0 0 #2ca9cc; }
  .hero-layer-img.cc-tilt-3 { transform: rotate(13.73deg); }
  .hero-layer-img.cc-tilt-4 { transform: rotate(-13.82deg); object-fit: contain; box-shadow: 15px 7px 0 0 #2ca9cc; }
  .hero-layer-img.cc-tilt-5 { transform: rotate(5.48deg); }

  /* Distinct placeholder fills, so a screenshot shows the stacking order.
     Local only — the real covers replace these in Webflow. */
  .cc-layer-1 .hero-layer-img { background: #1a1a1a; }   /* 董夫人      — front */
  .cc-layer-2 .hero-layer-img { background: #f06ba8; }   /* 香港電視 */
  .cc-layer-3 .hero-layer-img { background: #f3ded2; }   /* 電影 */
  .cc-layer-4 .hero-layer-img { background: #ffffff; }   /* 雙周刊題頭 */
  .cc-layer-5 .hero-layer-img { background: #c9a8d4; }   /* 南北喜相逢 — back */
</style>
</head>

<script>
/* Demo driver only — exercises growing the list past the 4-item window.
   None of this ships to Webflow. */
(function () {
  var list = document.querySelector("[data-hero-list]");
  var gallery = document.querySelector("[data-hero-gallery]");
  var note = document.getElementById("count-note");
  var extra = 0;

  function report() {
    note.textContent = list.children.length + " collections";
  }

  document.getElementById("add").addEventListener("click", function () {
    extra++;
    var key = "demo" + extra;

    var li = list.children[0].cloneNode(true);
    var link = li.querySelector("[data-hero-item]");
    link.setAttribute("data-collection", key);
    link.classList.remove("is-active");
    li.querySelector(".hero-collection-label").textContent = "示範刊物 " + extra;
    list.appendChild(li);

    var slide = gallery.querySelector('[data-collection="tvw"]').cloneNode(true);
    slide.setAttribute("data-collection", key);
    slide.classList.remove("is-active", "is-leaving");
    gallery.appendChild(slide);

    window.filmtvHero.init();
    report();
  });

  document.getElementById("remove").addEventListener("click", function () {
    if (list.children.length <= 1) return;
    var li = list.children[list.children.length - 1];
    var key = li.querySelector("[data-hero-item]").getAttribute("data-collection");
    li.parentNode.removeChild(li);
    var slide = gallery.querySelector('[data-collection="' + key + '"]');
    if (slide) slide.parentNode.removeChild(slide);
    window.filmtvHero.init();
    report();
  });

  report();

  /* Heat-map demo. Stands in for the per-year book counts the backend
     will supply; the shape is what render() expects. */
  var heatOn = true;
  var real = window.FILMTV_YEAR_COUNTS;
  document.getElementById('heat').addEventListener('click', function () {
    heatOn = !heatOn;
    if (heatOn) {
      window.FILMTV_YEAR_COUNTS = real;
      window.filmtvHeroYearGrid.render();
    } else {
      delete window.FILMTV_YEAR_COUNTS;
      window.filmtvHeroYearGrid.render();
    }
  });
})();
</script>
